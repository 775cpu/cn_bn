[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-kline-tracker"
version = "0.1.0"
description = "Realtime Binance trades, multi-period klines and Bollinger Bands"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9","python-binance","numpy","pandas"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
binance-tracker = "binance_tracker.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]
norecursedirs = ["src/qgb"]
